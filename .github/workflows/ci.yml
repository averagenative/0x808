name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgl-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Run engine tests
        working-directory: .
        run: |
          build/fm_synth_test
          build/project_test
          build/swing_humanize_test

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install sdl2
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)
      - name: Run engine tests
        working-directory: .
        run: |
          build/fm_synth_test
          build/project_test
          build/swing_humanize_test

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 via vcpkg
        run: |
          vcpkg install sdl2:x64-windows
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake
      - name: Build
        run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS
      - name: Run engine tests
        working-directory: .
        run: |
          build/Release/fm_synth_test.exe
          build/Release/project_test.exe
          build/Release/swing_humanize_test.exe
